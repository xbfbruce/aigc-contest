<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>选手端 - 作品提交</title>
    <link rel="stylesheet" href="styles.css">
    
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
    <nav class="top-nav">
        <div class="nav-brand">
            <a href="index.html">◆ 千问 AIGC 大赛</a>
        </div>
        <div class="nav-info">
            <span>选手端</span>
            <button onclick="location.href='index.html'" class="logout-btn">返回首页</button>
        </div>
    </nav>

    <div class="main-content">
        <div class="container">
            <!-- 登录区域 -->
            <section id="loginSection" class="login-section" style="max-width: 500px; margin: 2rem auto;">
                <h2>🔐 选手登录</h2>
                <p style="color: var(--text-secondary); margin-bottom: 1.5rem;">请使用姓名或手机号登录</p>
                <form id="contestantLoginForm" class="login-form">
                    <div class="form-group">
                        <label for="loginInput">姓名或手机号 *</label>
                        <input type="text" id="loginInput" required placeholder="请输入您的姓名或手机号">
                    </div>
                    <button type="submit" class="btn-primary">登录</button>
                </form>
                <div id="loginError" style="color: var(--danger); margin-top: 1rem; display: none;"></div>
            </section>

            <!-- 已提交提示(登录后如果已提交则显示) -->
            <section id="alreadySubmittedSection" class="submitted-section" style="display: none; text-align: center; padding: 3rem 1rem;">
                <div style="font-size: 4rem; margin-bottom: 1rem;">✅</div>
                <h2>您已成功提交作品</h2>
                <p style="color: var(--text-secondary); margin: 1rem 0;">每个选手只能提交一次作品,无法重复提交或修改</p>
                <div id="submittedWorkInfo" style="background: var(--bg-secondary); padding: 1.5rem; border-radius: 8px; margin: 2rem 0; max-width: 600px; margin-left: auto; margin-right: auto;">
                    <!-- 动态显示已提交的作品信息 -->
                </div>
                <button onclick="location.href='index.html'" class="btn-secondary">返回首页</button>
            </section>

            <!-- 参赛信息表单(登录后显示) -->
            <section id="formSection" class="form-section" style="display: none;">
            <section class="specs-section">
                <h2>📋 作品提交规范</h2>
                <div class="specs-box" id="submissionSpecs">
                    <div id="videoSpecsSection" class="spec-category">
                        <h3>🎬 视频作品</h3>
                        <ul id="videoSpecsList">
                            <!-- 动态生成 -->
                        </ul>
                    </div>
                    
                    <div id="imageSpecsSection" class="spec-category">
                        <h3>🖼️ 图像作品</h3>
                        <ul id="imageSpecsList">
                            <!-- 动态生成 -->
                        </ul>
                    </div>
                    
                    <div id="generalSpecs" class="spec-category" style="margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border-color);">
                        <h3>📝 通用要求</h3>
                        <ul id="generalSpecsList">
                            <!-- 动态生成 -->
                        </ul>
                    </div>
                </div>
            </section>

            <!-- 参赛信息表单 -->
            <section class="form-section">
                <h2>📝 参赛信息填写</h2>
                <form id="contestantForm" class="submission-form">
                    <div class="form-group">
                        <label for="name">姓名 *</label>
                        <input type="text" id="name" name="name" required placeholder="请输入您的姓名">
                    </div>

                    <div class="form-group">
                        <label for="school">学校 *</label>
                        <select id="school" name="school" required>
                            <option value="">请选择学校</option>
                            <!-- 动态加载学校列表 -->
                        </select>
                        <small style="color: var(--text-secondary);">如果找不到您的学校,请联系管理员添加</small>
                    </div>

                    <div class="form-group">
                        <label for="category">作品分类 *</label>
                        <select id="category" name="category" required onchange="updateUploadHint()">
                            <option value="">请选择分类</option>
                            <option value="video">🎬 视频作品（MP4格式）</option>
                            <option value="image">🖼️ 图像作品（JPG/PNG格式）</option>
                        </select>
                        <small id="uploadHint" style="color: var(--warning); display: none;">请先选择作品分类以查看上传要求</small>
                    </div>

                    <div class="form-group">
                        <label for="workTitle">作品标题 *</label>
                        <input type="text" id="workTitle" name="workTitle" required placeholder="请输入作品标题">
                    </div>

                    <div class="form-group">
                        <label>上传作品文件 *</label>
                        <div class="upload-area" id="uploadArea">
                            <input type="file" id="fileInput" multiple style="display: none;">
                            <div class="upload-placeholder" onclick="document.getElementById('fileInput').click()">
                                <div class="upload-icon">📁</div>
                                <p id="uploadText">请先选择作品分类</p>
                                <small id="uploadHint2">支持的视频或图片格式</small>
                            </div>
                            <div class="file-list" id="fileList"></div>
                        </div>
                        <small class="upload-hint" id="fileUploadHint">选择分类后将显示具体要求</small>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-primary">提交作品</button>
                    </div>
                </form>
            </section>
        </div>
    </div>

    <script src="storage-adapter.js"></script>
    <script src="analytics.js"></script>
    <script src="contestant.js"></script>
    <script src="background.js"></script>
</body>
</html>
