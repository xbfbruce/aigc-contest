<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase连接测试</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <style>
        body { font-family: Arial; padding: 2rem; max-width: 800px; margin: 0 auto; }
        .result { padding: 1rem; margin: 1rem 0; border-radius: 8px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        button { padding: 0.5rem 1rem; margin: 0.5rem; cursor: pointer; }
        pre { background: #f5f5f5; padding: 1rem; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🔍 Supabase连接测试</h1>
    
    <div id="status"></div>
    
    <button onclick="testConnection()">测试连接</button>
    <button onclick="testInsert()">测试插入数据</button>
    <button onclick="testSelect()">测试查询数据</button>
    
    <h2>测试结果:</h2>
    <div id="results"></div>
    
    <script>
        const SUPABASE_URL = 'https://pqchakbrsatzxepypkyo.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBxY2hha2Jyc2F0enhlcHlwa3lvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0NTg5MTQsImV4cCI6MjEwODAzNDkxNH0.Zn38gYyaRGfiGnk9AVeCFxBa0VmqXIXuJq_3MTHGOhU';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        function addResult(message, type = 'info') {
            const resultsDiv = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `result ${type}`;
            div.innerHTML = `<strong>${new Date().toLocaleTimeString()}</strong>: ${message}`;
            resultsDiv.appendChild(div);
        }
        
        async function testConnection() {
            addResult('正在测试连接...', 'info');
            
            try {
                const { data, error } = await supabase.from('works').select('count', { count: 'exact', head: true });
                
                if (error) {
                    addResult(`❌ 连接失败: ${error.message}`, 'error');
                    addResult(`<pre>错误详情: ${JSON.stringify(error, null, 2)}</pre>`, 'error');
                } else {
                    addResult(`✅ 连接成功!当前作品数: ${data}`, 'success');
                }
            } catch (err) {
                addResult(`❌ 未知错误: ${err.message}`, 'error');
            }
        }
        
        async function testInsert() {
            addResult('正在测试插入数据...', 'info');
            
            try {
                // 先创建一个测试选手
                const { data: contestant, error: contestantError } = await supabase
                    .from('contestants')
                    .insert([{ name: '测试用户', school: '测试学校' }])
                    .select()
                    .single();
                
                if (contestantError) {
                    addResult(`❌ 创建选手失败: ${contestantError.message}`, 'error');
                    return;
                }
                
                addResult(`✅ 创建选手成功, ID: ${contestant.id}`, 'success');
                
                // 创建测试作品
                const { data: work, error: workError } = await supabase
                    .from('works')
                    .insert([{
                        contestant_id: contestant.id,
                        category: 'image',
                        title: '测试作品',
                        description: '这是一个测试作品',
                        file_name: 'test.jpg',
                        file_size: 1024,
                        file_url: 'https://example.com/test.jpg',
                        status: 'pending'
                    }])
                    .select()
                    .single();
                
                if (workError) {
                    addResult(`❌ 创建作品失败: ${workError.message}`, 'error');
                    addResult(`<pre>错误详情: ${JSON.stringify(workError, null, 2)}</pre>`, 'error');
                    
                    // 清理测试数据
                    await supabase.from('contestants').delete().eq('id', contestant.id);
                    return;
                }
                
                addResult(`✅ 创建作品成功! ID: ${work.id}`, 'success');
                
                // 清理测试数据
                await supabase.from('works').delete().eq('id', work.id);
                await supabase.from('contestants').delete().eq('id', contestant.id);
                addResult('🗑️ 已清理测试数据', 'info');
                
            } catch (err) {
                addResult(`❌ 未知错误: ${err.message}`, 'error');
            }
        }
        
        async function testSelect() {
            addResult('正在测试查询数据...', 'info');
            
            try {
                const { data, error } = await supabase
                    .from('works')
                    .select('*')
                    .limit(5);
                
                if (error) {
                    addResult(`❌ 查询失败: ${error.message}`, 'error');
                } else {
                    addResult(`✅ 查询成功! 获取到 ${data.length} 条记录`, 'success');
                    if (data.length > 0) {
                        addResult(`<pre>${JSON.stringify(data[0], null, 2)}</pre>`, 'info');
                    }
                }
            } catch (err) {
                addResult(`❌ 未知错误: ${err.message}`, 'error');
            }
        }
        
        // 页面加载时显示状态
        document.getElementById('status').innerHTML = `
            <div class="result info">
                <strong>Supabase URL:</strong> ${SUPABASE_URL}<br>
                <strong>Anon Key:</strong> ${SUPABASE_ANON_KEY.substring(0, 20)}...<br>
                <small>点击上方按钮开始测试</small>
            </div>
        `;
    </script>
</body>
</html>
