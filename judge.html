<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>评委端 - 作品评审</title>
    <link rel="stylesheet" href="styles.css?v=20261107a">
    
    <!-- Supabase SDK -->
    <!-- Supabase SDK 已内置到本站 vendor/ 目录。
         原因：国内网络访问 cdn.jsdelivr.net 经常失败或极慢，SDK 一旦加载不到，
         整站会静默降级为"仅本机数据"模式，评委账号就无法跨设备登录。
         只有本地文件缺失时才依次回退到两个 CDN。 -->
    <script src="vendor/supabase.min.js?v=20261107a"></script>
    <script>
        if (typeof window.supabase === 'undefined') {
            document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"><\/script>');
        }
    </script>
    <script>
        if (typeof window.supabase === 'undefined') {
            document.write('<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.min.js"><\/script>');
        }
    </script>
</head>
<body>
    <nav class="top-nav">
        <div class="nav-brand">
            <a href="index.html">◆ 千问 AIGC 大赛</a>
        </div>
        <div class="nav-info">
            <span id="judgeName">评委：<span class="judge-name-display">未登录</span></span>
            <button onclick="logout()" class="logout-btn">退出登录</button>
        </div>
    </nav>

    <div class="main-content">
        <div class="container">
            <!-- 登录区域 -->
            <section id="loginSection" class="login-section">
                <h2>评委登录</h2>
                <form id="judgeLoginForm" class="login-form">
                    <div class="form-group">
                        <label for="judgeUsername">账号</label>
                        <input type="text" id="judgeUsername" required placeholder="请输入评委账号">
                    </div>
                    <div class="form-group">
                        <label for="judgePassword">密码</label>
                        <input type="password" id="judgePassword" required placeholder="请输入密码">
                    </div>
                    <button type="submit" class="btn-primary">登录</button>
                </form>

                <!-- 连接自检：登录不上时点这里，可判断是旧缓存、SDK 未加载还是云端连不通 -->
                <div id="selfTestMount" class="selftest-mount"></div>
            </section>

            <!-- 评审工作台（登录后显示） -->
            <section id="workbenchSection" class="workbench-section" style="display: none;">
                <div class="progress-bar">
                    <div class="progress-info">
                        <span>评审进度</span>
                        <span id="progressText">0 / 0 已完成</span>
                    </div>
                    <div class="progress-track">
                        <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                    </div>
                </div>

                <!-- 组别筛选器 -->
                <div class="filter-section" style="margin-bottom: 1.5rem;">
                    <h2>待评审作品列表</h2>
                    <div class="form-group" style="max-width: 400px; margin-top: 1rem;">
                        <label for="groupFilter">选择组别</label>
                        <select id="groupFilter" onchange="filterWorksByGroup()">
                            <!-- 组别选项由 storage.populateGroupSelect 统一生成，与选手名单、管理端保持一致 -->
                            <option value="">全部组别</option>
                        </select>
                    </div>
                </div>
                
                <div class="works-list" id="worksList">
                    <div class="empty-state">暂无分配的作品</div>
                </div>

                <!-- 打分面板 -->
                <div id="scoringPanel" class="scoring-panel" style="display: none;">
                    <div class="panel-header">
                        <button onclick="closeScoringPanel()" class="back-btn">← 返回列表</button>
                        <h3 id="scoringWorkTitle">作品打分</h3>
                    </div>

                    <div class="work-detail">
                        <div class="work-info-card">
                            <h4>作品信息</h4>
                            <div class="info-grid">
                                <div><strong>标题：</strong><span id="detailTitle">-</span></div>
                                <div><strong>分类：</strong><span id="detailCategory">-</span></div>
                                <div><strong>组别：</strong><span id="detailGroup">-</span></div>
                                <div><strong>作者：</strong><span id="detailAuthor">匿名</span></div>
                                <div><strong>学校：</strong><span id="detailSchool">-</span></div>
                            </div>
                            <div class="work-description">
                                <strong>作品描述：</strong>
                                <p id="detailDescription">-</p>
                            </div>
                            <div class="work-files">
                                <strong>附件文件：</strong>
                                <div id="detailFiles" class="file-links"></div>
                            </div>
                        </div>

                        <div class="scoring-form">
                            <h4>作品评分（0-100分）</h4>
                            
                            <div style="background: var(--bg-secondary); padding: 2rem; border-radius: 12px; text-align: center; margin: 1.5rem 0;">
                                <label for="scoreInput" style="font-size: 1.2rem; font-weight: 600; display: block; margin-bottom: 1rem;">
                                    请输入评分
                                </label>
                                <input 
                                    type="number" 
                                    id="scoreInput" 
                                    min="0" 
                                    max="100" 
                                    step="0.1" 
                                    value="0"
                                    oninput="handleScoreChange(this.value)"
                                    style="width: 200px; padding: 1rem; font-size: 2rem; font-weight: 700; text-align: center; border: 3px solid var(--primary); border-radius: 12px; background: #ffffff; color: #000000; -webkit-text-fill-color: #000000; opacity: 1;"
                                >
                                <div style="margin-top: 1rem; font-size: 1.5rem; color: var(--primary);">
                                    当前评分：<span id="scoreDisplay" style="font-size: 2.5rem; font-weight: bold;">0.0</span> 分
                                </div>
                                <small style="color: var(--text-secondary); display: block; margin-top: 0.5rem;">
                                    支持小数，精确到0.1分
                                </small>
                            </div>

                            <div class="scoring-actions">
                                <button onclick="saveScore()" class="btn-secondary">暂存评分</button>
                                <button onclick="submitScore()" class="btn-primary">提交评分</button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <!-- 图片预览模态框（支持滚轮缩放 / 拖拽平移 / 双击放大） -->
    <div id="imagePreviewModal" class="modal" style="display: none;" onclick="closeImagePreview()">
        <div class="modal-content image-preview-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 id="previewImageTitle">图片预览</h3>
                <button onclick="closeImagePreview()" class="close-btn">×</button>
            </div>
            <div class="preview-container" id="previewContainer">
                <div class="preview-stage" id="previewStage">
                    <img id="previewImage" src="" alt="预览图片" draggable="false">
                    <div class="preview-zoom-bar" onclick="event.stopPropagation()">
                        <button onclick="zoomImage(-0.2)" class="zoom-btn" title="缩小">−</button>
                        <span id="zoomLevel" class="zoom-level">100%</span>
                        <button onclick="zoomImage(0.2)" class="zoom-btn" title="放大">＋</button>
                        <button onclick="resetImageView()" class="zoom-btn zoom-reset" title="恢复适应窗口">适应</button>
                    </div>
                </div>
                <div class="preview-info" id="previewImageInfo"></div>
            </div>
            <div class="preview-actions">
                <button onclick="prevImage()" class="btn-secondary">← 上一张</button>
                <span id="imageCounter" style="color: var(--text-secondary);"></span>
                <button onclick="nextImage()" class="btn-secondary">下一张 →</button>
            </div>
        </div>
    </div>

    <script src="storage-adapter.js?v=20261107a"></script>
    <script src="selftest.js?v=20261107a"></script>
    <script src="analytics.js?v=20261107a"></script>
    <script src="judge.js?v=20261107a"></script>
    <script src="background.js?v=20261107a"></script>
</body>
</html>
